- id: '2'
  title: 창업 아이템의 개발 계획
  category: Solution
  order: 2
  tags:
  - 개발준비
  - 차별성
  - 일정자금
  instructions: |
    아이디어를 제품·서비스로 개발 또는 구체화하고자 하는 계획(사업기간 내 일정 등)
    정부지원사업비는 최대 1.5억원 한도 이내로 작성
    자기부담사업비는 사업장 소재지(본점)를 기준으로 (1)지방우대 비해당 지역과 (2)지방우대 지
    신청자 사업장의 소재지를 기준으로 “모집공고 [붙임6]” 의 지방우대 시범사업 지역

    ▶ 표 1 — 필수:
    | 구분 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    | 1 | 필수 개발 인력 채용 | 00.00 ~ 00.00 | OO 전공 경력 직원 00명 채용 |
    | 2 | 제품 패키지 디자인 | 00.00 ~ 00.00 | 제품 패키지 디자인 용역 진행 |
    | 3 | 홍보용 웹사이트 제작 | 00.00 ~ 00.00 | 웹사이트 자체 제작 |
    | 4 | 시제품 완성 | 협약기간 말 | 협약기간 내 시제품 제작 완료 |
    | … |  |  |  |

    ▶ 표 2 — 필수:
    | 구분 | 총사업비 (A=B+C) | 정부지원사업비 (B) | 창업기업 자기부담사업비(C) |  |
    | --- | --- | --- | --- | --- |
