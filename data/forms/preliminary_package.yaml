program_code: preliminary_package
program_name: 2026년도 예비창업패키지(일반형)
target: 사업자등록 전 예비창업자
max_funding: 6000만원
page_limit: 10
notes: |
  사업계획서는 목차(1페이지) 제외하고 10페이지 이내로 작성.
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  표 안의 행은 추가 가능; 해당 없을 시 공란 유지.
  대표자·직원 성명, 성별, 생년월일, 대학교명 등 개인정보는 ○ 또는 *로 마스킹.
sections:
- id: '1'
  title: 창업 아이템의 필요성
  category: Problem
  order: 1
  tags:
  - 개발동기
  - 시장분석
  instructions: |
    개발하고자 하는 창업 아이템의 국내·외 시장 현황 및 문제점 등의 제시
    문제 해결을 위한 창업 아이템의 개발 필요성 등 기재

- id: '2'
  title: 창업 아이템의 개발 계획
  category: Solution
  order: 2
  tags:
  - 개발준비
  - 차별성
  - 일정자금
  instructions: |
    아이디어를 제품·서비스로 개발 또는 구체화 하고자 하는 계획(사업기간 내 일정 등)
    개발 창업 아이템의 기능·성능의 차별성 및 경쟁력 확보 전략
    정부지원사업비 집행 계획 기재

    ▶ 표 1 — 필수 (사업추진 일정):
    | 구분 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    | 1 | 필수 개발 인력 채용 | 00.00 ~ 00.00 | OO 전공 경력 직원 00명 채용 |
    | 2 | 제품 패키지 디자인 | 00.00 ~ 00.00 | 제품 패키지 디자인 용역 진행 |
    | 3 | 홍보용 웹사이트 제작 | 00.00 ~ 00.00 | 웹사이트 자체 제작 |
    | 4 | 시제품 완성 | 협약기간 말 | 협약기간 내 시제품 제작 완료 |
    | … |  |  |  |

    ▶ 표 2 — 필수 (1단계 정부지원사업비 집행계획, 20백만원 내외):
    | 비 목 | 산출 근거 | 정부지원사업비(원) |
    | --- | --- | --- |
    | 재료비 | •DMD소켓 구입(00개×0000원) | 3,000,000 |
    |  | •전원IC류 구입(00개×000원) | 7,000,000 |
    | 외주용역비 | •시금형제작 외주용역(OOO제품 플라스틱금형제작) | 10,000,000 |
    | … |  |  |
    | 합 계 |  | ... |

    ▶ 표 3 — 필수 (2단계 정부지원사업비 집행계획, 20백만원 내외):
    | 비 목 | 산출 근거 | 정부지원사업비(원) |
    | --- | --- | --- |
    | 재료비 | •DMD소켓 구입(00개×0000원) | 3,000,000 |
    |  | •전원IC류 구입(00개×000원) | 7,000,000 |
    | 외주용역비 | •시금형제작 외주용역(OOO제품 플라스틱금형제작) | 10,000,000 |
    | … |  |  |
    | 합 계 |  | ... |

- id: '3'
  title: 사업화 추진 전략
  category: Scale-up
  order: 3
  tags:
  - BM
  - 사업화전략
  - 투자
  - ESG
  instructions: |
    경쟁제품·경쟁사 분석, 창업 아이템의 목표 시장 진입 전략 등 기재
    창업 아이템의 비즈니스 모델(수익화 모델), 사업 확장을 위한 투자유치 전략
    사업 전체 로드맵(일정)과 중장기적 사회적 가치 도입계획

    ▶ 표 1 — 필수 (전체 사업추진 일정):
    | 구분 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    | 1 | 시제품 설계 | 00년 상반기 | 시제품 설계 및 프로토타입 제작 |
    | 2 | 시제품 제작 | 00.00 ~ 00.00 | 외주 용역을 통한 시제품 제작 |
    | 3 | 정식 출시 | 00년 하반기 | 신제품 출시 |
    | … |  |  |  |

- id: '4'
  title: 대표자 및 팀원 구성 계획
  category: Team
  order: 4
  tags:
  - 팀역량
  - 대표자
  instructions: |
    성명, 성별, 생년월일, 출신학교, 소재지 등의 개인정보는 삭제 또는 마스킹
    대표자 보유 역량(경영 능력, 경력·학력, 기술력, 노하우, 인적 네트워크 등) 기재
    팀에서 보유 또는 보유할 예정인 장비·시설, 직원 역량 기재
    협약기간 내 채용 예정인 인력에 대해서 기재

    ▶ 표 1 — 필수 (팀 구성):
    | 구분 | 직위 | 담당 업무 | 보유역량(경력 및 학력 등) | 구성 상태 |
    | --- | --- | --- | --- | --- |
    | 1 | 공동대표 | S/W 개발 총괄 | OO학 박사, OO학과 교수 재직(00년) | 완료('00.00) |
    | 2 | 대리 | 홍보 및 마케팅 | OO학 학사, OO 관련 경력(00년 이상) | 예정('00.00) |
    | … |  |  |  |  |

    ▶ 표 2 — 필수 (협력 기관 현황):
    | 구분 | 파트너명 | 보유역량 | 협업방안 | 협력 시기 |
    | --- | --- | --- | --- | --- |
    | 1 | ○○전자 | 시제품 관련 H/W 제작·개발 | 테스트 장비 지원 | 00.00 |
    | 2 | ○○기업 | S/W 제작·개발 | 웹사이트 제작 용역 | 00.00 |
    | ... |  |  |  |  |
