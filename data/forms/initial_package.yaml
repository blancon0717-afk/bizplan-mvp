program_code: initial_package
program_name: 2026년도 초기창업패키지(일반형)
target: 창업 3년 이내 초기 창업기업
max_funding: 1억원
page_limit: 15
notes: |
  사업계획서는 목차(1페이지)를 제외하고 15페이지 내외로 작성(증빙서류는 제한 없음).
  사업계획서 양식은 변경·삭제할 수 없으며, 추가설명을 위한 이미지(사진), 표 등은 삽입 가능
  (표 안의 행은 추가 가능하며, 해당 없을 시 공란 유지).
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  대표자·직원 성명, 성별, 생년월일, 대학교(원)명 및 소재지, 직장명 등의 개인정보는
  반드시 제외하거나 '○', '*' 등으로 마스킹하여 작성.
  ※ 2026년도 공식 사업계획서 양식(별첨1) 기준 목차·표 구조를 그대로 따른다.
sections:
- id: '0-1'
  title: 일반현황
  category: Overview
  order: 1
  tags: []
  instructions: |
    ※ 행정 정보 표. 초안에 없는 행정 정보(사업자번호·개업연월일 등)는 절대 지어내지 말고
    공란 유지. '창업아이템명'과 '산출물'만 초안 근거로 제안한다.

    ▶ 표 1 — 일반현황 (공란 유지, 아이템명·산출물만 제안):
    | 항목 | 내용 |
    | --- | --- |
    | 기업명 |  |
    | 개업연월일 |  |
    | 사업자 구분 | 개인사업자 / 법인사업자 |
    | 대표자 유형 | 단독 / 공동 / 각자대표 |
    | 사업자등록번호(법인등록번호) |  |
    | 사업자 소재지(본사(점)) |  |
    | 창업아이템명 | (OO기술이 적용된 OO기능의 OO제품·서비스 — 초안 기반 제안) |
    | 산출물(협약기간 내 목표) | (협약기간 내 제작·개발 완료할 최종 생산품의 형태, 수량 — 초안 기반 제안) |
    | 지원 분야(택1) | 제조 / 지식서비스 |
    | 전문기술분야(택1) | 기계·소재 / 전기·전자 / 정보·통신 / 화공·섬유 / 바이오·의료·생명 / 에너지·자원 / 공예·디자인 |
    | 지방우대 지역 해당여부 | 특별지원 / 우대지원 / 일반지역 / 지방우대 비해당 |

    ▶ 표 2 — 총 사업비 구성 계획 (근거 없으면 공란):
    | 정부지원사업비(A) | 자기부담 현금 | 자기부담 현물 | 총 사업비(C=A+B) |
    | --- | --- | --- | --- |
    |  |  |  |  |

    ▶ 표 3 — 팀 구성 현황 (대표자 본인 제외, 초안 근거로만):
    | 순번 | 직위 | 담당 업무 | 보유 역량(경력 및 학력 등) | 구성 상태 |
    | --- | --- | --- | --- | --- |
    |  |  |  |  |  |

- id: '0-2'
  title: 창업 아이템 개요(요약)
  category: Overview
  order: 2
  tags: [시장분석, 차별성, BM]
  instructions: |
    초안 전체를 압축한 요약 표. 각 항목을 초안 내용으로 채운다.

    ▶ 표 1 — 창업 아이템 개요:
    | 항목 | 내용 |
    | --- | --- |
    | 명칭 | (제품·서비스명) |
    | 범주 | (예: 스포츠음료, OS, 인공지능프로그램 등) |
    | 아이템 개요 | (개발·구체화할 제품·서비스 개요 — 사용 용도·사양·가격, 핵심 기능·성능, 고객 제공 혜택) |
    | 문제 인식(Problem) | (국내·외 시장 현황 및 문제점, 개발 필요성 요약) |
    | 실현 가능성(Solution) | (사업기간 내 개발·구체화 계획, 차별성·경쟁력 확보 전략 요약) |
    | 성장전략(Scale-up) | (경쟁사 분석, 목표 시장 진입 전략, BM, 로드맵, 투자유치 전략 요약) |
    | 팀 구성(Team) | (대표자·팀원·업무파트너 역량 활용 계획 요약) |

- id: '1'
  title: 문제 인식 (Problem)_창업 아이템의 필요성
  category: Problem
  order: 3
  tags: [개발동기, 시장분석]
  instructions: |
    개발하고자 하는 창업 아이템의 국내·외 시장 현황 및 문제점 등의 제시.
    문제 해결을 위한 창업 아이템의 개발 필요성 등 기재(개발 아이템 소개 포함).

- id: '2'
  title: 실현 가능성 (Solution)_창업 아이템의 개발 계획
  category: Solution
  order: 4
  tags: [개발준비, 차별성, 일정자금]
  instructions: |
    아이디어를 제품·서비스로 개발 또는 구체화하고자 하는 계획(사업기간 내 일정 등).
    개발 창업 아이템의 기능·성능의 차별성 및 경쟁력 확보 전략.
    정부지원사업비 및 자기부담사업비의 집행 계획 기재.
    ※ 정부지원사업비는 최대 1억원 한도. 초안에 근거 없는 금액은 지어내지 말고
      공란 또는 산출근거만 제시.

    ▶ 표 1 — 사업추진 일정(협약기간 내):
    | 구분 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    |  |  |  |  |

    ▶ 표 2 — 사업비 집행 계획:
    | 비목 | 집행 계획 | 정부지원사업비(ⓐ) | 자기부담 현금 | 자기부담 현물 | 합계(ⓐ+ⓑ) |
    | --- | --- | --- | --- | --- | --- |
    | 재료비 |  |  |  |  |  |
    | 외주용역비 |  |  |  |  |  |
    | 합 계 |  |  |  |  |  |

- id: '3'
  title: 성장전략 (Scale-up)_사업화 추진 전략
  category: Scale-up
  order: 5
  tags: [BM, 사업화전략, 투자, ESG]
  instructions: |
    경쟁제품·경쟁사 분석, 창업 아이템의 목표 시장 진입 전략 등 기재.
    창업 아이템의 비즈니스 모델(수익화 모델), 사업 확장을 위한 투자유치(자금확보) 전략.
    사업 전체 로드맵(일정)과 중장기적 사회적 가치 도입계획:
    - 환경: 폐기물 배출 감소, 재활용 확대, 친환경 원료 개발, 에너지 절감 등 환경보호 노력
    - 사회: 지역사회 교류, 사회 환원, 인권, 평등, 다양성 존중 등 사회적 책임경영 노력
    - 지배구조: 윤리경영, 상호 존중 조직문화 구축, 근로 환경 개선 등의 투명 경영 노력

    ▶ 표 1 — 사업추진 일정(전체 사업단계):
    | 구분 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    |  |  |  |  |

- id: '4'
  title: 팀 구성 (Team)_대표자 및 팀원 구성 계획
  category: Team
  order: 6
  tags: [팀역량, 대표자]
  instructions: |
    ※ 성명, 성별, 생년월일, 출신학교, 소재지 등의 개인정보(유추가능한 정보)는 삭제 또는 마스킹.
    [학력] (전문)학·석·박사, 학과·전공 등, [직장] 직업, 주요 수행업무 등만 작성 가능.
    대표자 보유 역량(경영 능력, 경력·학력, 기술력, 노하우, 인적 네트워크 등) 기재.
    팀에서 보유 또는 보유할 예정인 장비·시설, 직원 역량 기재.
    협약기간 내 채용 예정인 인력에 대해 기재.
    협력(또는 예정)인 파트너, 협력 기관(기업) 등 역량과 주요 협업 내용 기재.

    ▶ 표 1 — 팀 구성(안):
    | 구분 | 직위 | 담당 업무 | 보유 역량(경력 및 학력 등) | 구성 상태 |
    | --- | --- | --- | --- | --- |
    |  |  |  |  |  |

    ▶ 표 2 — 협력 기관 현황 및 협업 방안:
    | 구분 | 파트너명 | 보유 역량 | 협업 방안 | 협력 시기 |
    | --- | --- | --- | --- | --- |
    |  |  |  |  |  |

# ── 갭 보완 인터뷰 (양식 변환 전 고정 5문항 — 초안에 없는 초창패 필수 정보) ──
gap_questions:
- id: gq1
  question: 협약기간(약 8개월) 내 완성할 최종 산출물은 무엇인가요? 형태와 수량을 알려주세요.
  hint: "예: 시제품(하드웨어) 1식, 정식 출시 앱 1건, SaaS 베타 버전 1건"
  target_sections: ['0-1', '0-2', '2']
- id: gq2
  question: 신청할 정부지원사업비 규모와 자기부담금(현금·현물) 계획을 알려주세요.
  hint: "예: 정부지원 7,000만원 + 자기부담 현금 500만원, 현물 500만원"
  target_sections: ['0-1', '3']
- id: gq3
  question: 지원금을 주로 어디에 사용할 계획인가요? 주요 비목별 금액을 알려주세요.
  hint: "예: 인건비 3,000만원, 시제품 제작(외주) 2,500만원, 마케팅 1,000만원"
  target_sections: ['3']
- id: gq4
  question: 대표자 외 현재 팀원 구성(직위·담당업무·주요 경력)과 협약기간 내 채용 계획을 알려주세요.
  hint: "예: CTO 1명(백엔드 개발 8년), 협약기간 내 마케터 1명 채용 예정"
  target_sections: ['0-1', '4']
- id: gq5
  question: 협약기간 내 월별 주요 추진 일정(마일스톤)을 알려주세요.
  hint: "예: 1~3개월 MVP 개발 → 4~5개월 베타 테스트 → 6개월 정식 출시 → 7~8개월 마케팅"
  target_sections: ['2', '3']
