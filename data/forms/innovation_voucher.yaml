program_code: innovation_voucher
program_name: 2026년 중소기업 혁신바우처 사업(일반)
target: 제조업을 주 업종으로 하는 중소기업(소기업, 3년평균 매출액 140억원 이하 등) — 일반 바우처
max_funding: 5천만원
page_limit: 2
notes: |
  개인정보(성명·생년월일·출신학교·소재지 등)는 마스킹(○, * 등) 또는 삭제.
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  표 안의 행은 추가 가능; 해당 없을 시 공란 유지.
  컨설팅·기술지원·마케팅 중 신청하지 않는 분야는 삭제.
  분야별 정부지원금 최대 한도(고정): 컨설팅 5,000만원 / 기술지원 3,000만원 / 마케팅 2,000만원.
  기업별 정부지원금 총 한도 5,000만원. 보조율은 평균 매출액 규모별 45~85%(지역 우대 시 5~15%p 추가).
  ※ 본 양식은 서술형 사업계획서가 아닌 표 채우기 서식이므로, 초안에 없는 신상·수치 정보는
    지어내지 말고 공란으로 남겨 사용자가 직접 채우도록 한다.
sections:
- id: '1'
  title: 혁신바우처 사업 추진 총괄책임자
  category: Team
  order: 1
  tags:
  - 팀역량
  - 대표자
  instructions: |
    ※ 이 섹션은 총괄책임자의 신상 정보(개인정보)로, 프레임워크 초안에 존재하지 않는다.
    절대 지어내지 말 것. 출력은 아래 표 스켈레톤들을 **동일 컬럼의 markdown 표로 그대로**
    출력하는 것이 전부다(안내문 서술 금지). 셀은 공란으로 유지하여 사용자가 직접 입력하도록 한다.
    (개인정보는 마스킹 또는 삭제 원칙)

    ▶ 표 1 — 총괄책임자 기본정보 (필수, 공란 유지):
    | 항목 | 내용 |
    | --- | --- |
    | 업체명 |  |
    | 대표자명 |  |
    | 책임자명 |  |
    | 직위 |  |
    | 휴대전화 |  |
    | 최종학력 및 전공 |  |
    | 생년월일 |  |
    | 이메일 |  |

    ▶ 표 2 — 경력 (필수, 공란 유지):
    | 연도 | 기관명 | 직위 | 비고 |
    | --- | --- | --- | --- |
    |  |  |  |  |
    |  |  |  |  |

    ▶ 기타 특기사항 (공란 유지):
    ◦ 수상경력
    ◦ 특허 출원 및 등록 등
- id: '2'
  title: 주요 생산제품 및 보유기술
  category: Solution
  order: 2
  tags:
  - 시장분석
  - 차별성
  - 개발준비
  instructions: |
    프레임워크 초안의 시장 분석·아이템 기술·지식재산권 내용을 아래 표 항목에 맞게 재배치한다.
    초안에 없는 항목은 공란으로 남긴다(창작 금지).

    ▶ 표 1 — 주요 생산제품 및 보유기술 (필수):
    | 항목 | 내용 |
    | --- | --- |
    | 제품용도 및 특성 | (주력 생산 제품의 용도 및 특성) |
    | 제품생산 공정 | (주 생산제품의 생산 공정을 흐름순으로) |
    | 시장 상황 | (주요 수요처, 경쟁업체 현황 등) |
    | 기술품질 경쟁력 | (국내외 경쟁사 제품과 기술·품질·가격 비교, 핵심기술·기술개발환경·품질관리 현황) |
    | 지식재산권 및 인증 보유현황 | (특허·상표권·디자인 등 지식재산권 출원/등록 및 인증현황) |
- id: '3'
  title: 추진목표
  category: Scale-up
  order: 3
  tags:
  - 사업화전략
  - BM
  instructions: |
    신청한 바우처 분야(컨설팅·기술지원·마케팅)별 적용 및 활용분야, 달성목표를 작성한다.
    ※ 사용자가 선택한 바우처 서비스에 대해서만 작성한다(아래 별도 안내가 있으면 그 목록을 따른다.
      안내가 없으면 3개 분야 모두 작성). 초안의 추진성과·사업화전략 내용을 근거로 목표를 구체화한다.

    ◦ 추진목표
    - 신청 분야별 적용 및 활용분야를 기재
    - 바우처 활용을 통해 달성하고자 하는 목표를 정량·정성적으로 기재
- id: '4'
  title: 신청내용
  category: Scale-up
  order: 4
  tags:
  - 사업화전략
  instructions: |
    컨설팅·기술지원·마케팅 중 신청하는 분야의 과제명(주제)을 작성한다.
    ※ 사용자가 선택한 바우처 서비스에 대해서만 표에 포함한다(아래 별도 안내가 있으면 그 목록을 따른다.
      안내가 없으면 3개 분야 모두 작성). 선택되지 않은 분야의 행은 표에서 삭제한다.
    아이템 특성에 근거해 실제로 필요한 과제를 제안하되, 예시임을 알 수 있도록 구체적으로 작성한다.

    ▶ 표 1 — 신청내용 (선택 분야만):
    | 분야 | 과제명(주제) |
    | --- | --- |
    | 컨설팅 | (예: 재무구조 개선을 위한 원가분석 컨설팅) |
    | 기술지원 | (예: 시제품 제작·성능 개선을 위한 기술지원) |
    | 마케팅 | (예: 비대면 홍보를 위한 홍보 콘텐츠 제작) |
- id: '5'
  title: 추진일정
  category: Scale-up
  order: 5
  tags:
  - 일정자금
  instructions: |
    【출력 형식 — 반드시 아래 두 요소만, 이 순서로 출력】
    1) 한 줄 개요: "◦ 협약기간(2026년 2월~10월) 내 OO·OO 분야 추진일정" 형식 1줄.
    2) ▶ 표 1과 동일한 컬럼 구조의 markdown 간트 표:
       - 사용자가 선택한 바우처 분야의 행만 포함(선택 안 된 분야 행 삭제)
       - 활동 예정인 월의 셀에 ■, 활동 없는 월은 공란 (원본 서식의 빗금색칠/Bar 대체)
    그 외 문단·월별 서술·표 밖 일정 나열·다른 연도(2027 등) 표기는 절대 출력하지 않는다.
    연도 기준은 협약기간 2026년(2월~10월) 고정.

    ▶ 표 1 — 추진일정 (선택 분야만, 활동 월에 ■ 표기):
    | 분야 | 2월 | 3월 | 4월 | 5월 | 6월 | 7월 | 8월 | 9월 | 10월 |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | 컨설팅 | ■ | ■ |  |  |  |  |  |  |  |
    | 기술지원 |  |  | ■ | ■ | ■ |  |  |  |  |
    | 마케팅 |  |  |  |  |  | ■ | ■ | ■ |  |
    (위 ■ 배치는 예시 — 실제 과제 내용에 맞게 배치할 것)
- id: '6'
  title: 지원효과
  category: Scale-up
  order: 6
  tags:
  - BM
  - 사업화전략
  instructions: |
    바우처 지원을 통해 기대되는 성과(향후 매출 연계 가능성, 예상 매출 성과, 고용창출 효과,
    산업적 파급효과 등)를 서술하고, 아래 정량 지표 표를 작성한다.
    ※ 정량 수치는 초안에 근거가 없으면 공란으로 남긴다(임의 수치 생성 금지).
    선택한 바우처 서비스와 연계된 성과 위주로 서술한다.

    ◦ 지원효과(정성)
    - 기대 성과, 향후 매출 연계 가능성, 산업적 파급효과 등을 서술

    ▶ 표 1 — 지원효과(정량) (필수):
    | 구분 | 지표 | 값 |
    | --- | --- | --- |
    | 고용창출 | 고용 증가율(%) |  |
    | 고용창출 | 신규 고용인원수(명) |  |
    | 매출증대 | 매출액 증가율(%) |  |
    | 매출증대 | 매출 증가액(천원) |  |

# ── 갭 보완 인터뷰 (양식 변환 전 고정 5문항 — 초안에 없는 혁신바우처 필수 정보) ──
gap_questions:
- id: gq1
  question: 바우처 사업을 총괄할 책임자의 직위와 담당 업무를 알려주세요.
  hint: "예: 대표이사 본인 / 경영지원팀장(사업관리 총괄)"
  target_sections: ['1']
- id: gq2
  question: 주요 생산제품(또는 서비스)과 보유 기술 현황을 매출 비중과 함께 알려주세요.
  hint: "예: 정밀부품 A(매출 60%), 모듈 B(40%) — 자체 가공기술, 관련 인증 보유"
  target_sections: ['2']
- id: gq3
  question: 신청한 바우처 서비스로 해결하려는 구체적인 문제나 개선 과제를 알려주세요.
  hint: "예: 생산공정 불량률 개선 컨설팅, 신제품 시험분석, 홈페이지·카탈로그 제작"
  target_sections: ['3', '4']
- id: gq4
  question: 바우처 수행 기간 내 월별 추진 일정을 알려주세요.
  hint: "예: 1~2개월 현황 진단 → 3~4개월 개선 실행 → 5개월 결과 검증"
  target_sections: ['5']
- id: gq5
  question: 사업 완료 후 기대하는 정량적 효과를 알려주세요.
  hint: "예: 불량률 5%→2% 절감, 연매출 10% 증가, 신규 거래처 3곳 확보"
  target_sections: ['6']
