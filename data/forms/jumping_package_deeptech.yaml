program_code: jumping_package_deeptech
program_name: 2026년도 창업도약패키지(딥테크 특화형)
target: 딥테크 분야 창업 3년 초과 ~ 7년 이내 창업기업
max_funding: 3억원
page_limit: 20
notes: |
  개인정보(성명·성별·생년월일·출신학교·소재지 등)는 마스킹(○, * 등) 또는 삭제.
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  표 안의 행은 추가 가능; 해당 없을 시 공란 유지.
sections:
- id: '1'
  title: 1. 창업아이템 개발 동기(필요성) 및 현황
  category: Problem
  order: 1
  tags:
  - 개발동기
  - 시장분석
  instructions: |
    창업아이템(제품·서비스) 개선·고도화, 신규 출시 배경과 이를 뒷받침할 근거, 동기 등을 제시
    배경에서 발견한 문제점과 해결방안, 필요성, 제품·서비스를 개선·고도화 또는 신규 출시
    본 사업에 신청하기 이전까지 기획, 추진한 경과(이력) 등에 대해 기재
- id: '2'
  title: 2-1. 창업아이템 목표시장(고객) 분석
  category: Solution
  order: 2
  tags:
  - 개발준비
  - 차별성
  - 일정자금
  instructions: |
    아이템(제품, 서비스 혹은 기술)을 소개하고, 핵심 BM모델 등을 서술
    자사가 개발(보유) 중인 아이템에 대해 본 사업 참여를 통해 개발·개선하려는 과제
    목표 시장(고객) 요구사항 등 분석을 통해 파악된 문제점 및 개선점에 대해 핵심 기능·성능,
    기존 시장 내 경쟁사 제품·서비스와의 비교를 통해 파악된 문제점에 대해 자사의 보유 역량을
    현재 진입한 목표시장(고객) 진입 현황과 관련 실적 기재
    서비스의 경우 회원(이용자) 확보 및 다운로드 수 등 기재

    ▶ 표 1 — 필수:
    | 순번 | 목표시장(고객) | 제품·서비스 | 진입 시기 (기간) | 판매 (이용)량 | 가격 | 발생 매출액 |
    | --- | --- | --- | --- | --- | --- | --- |
    | 1 | OO업체 | OOO | 00년 상반기 | OO | 00백만원 | 00백만원 |
    | 2 | OO업체(A국가) | OOO | 00.00 ~ 00.00 | OO | 00백만원 | 00백만원 |
    | 3 | OO앱 스토어 | OOO | 00년 하반기 | 00회 | - | (무료 다운로드) |
    | 4 | OO 사이트 | OOO | 00.00 ~ 00.00 | 00명 | - | (무료 회원가입) |
    | ....... |  |  |  |  |  |  |
- id: '3'
  title: 3-1. 창업아이템 사업화 추진 전략(협약기간 내 목표 달성 방안)
  category: Scale-up
  order: 3
  tags:
  - BM
  - 사업화전략
  - 투자
  - ESG
  instructions: |
    정의된 목표시장(고객)에 진출 및 확대하기 위한 구체적인 방안과 고객 확보 전략, 수익
    협약기간 내 국내·외 시장 확대 및 성과 창출 전략 등 기재
    인수·합병(M&A), 기업공개(IPO) 등 출구의 필요성과 출구 목적, 목표 등 작성(해당 시)
    기타 개선·고도화 또는 신규 출시하고자 하는 제품·서비스 관련 기술 보호 계획 등
    제품·서비스의 개선·고도화 및 사업화 활동을 위해 협약기간 내 추진하려는 달성 가능한
    정부지원사업비는 최대 3억원 한도로 작성
    사업장 소재지(본점)를 기준으로 지방우대 지역(특별지원 지역, 우대지원 지역, 일반지역)과
    다음의 사업비 구성은 사업 운영 계획과 관련한 평가 참고용으로, 선정 이후 동 사업 운영

    ▶ 표 1 — 필수:
    | 순번 | 목표시장(고객) | 제품·서비스 | 진출 시기(기간) | 판매 (이용)량 | 가격 | 판매 금액 |
    | --- | --- | --- | --- | --- | --- | --- |
    | 1 | OO업체 | OOO | 00년 상반기 | OO | 00백만원 | 00백만원 |
    | 2 | OO업체(A국가) | OOO | 00.00 ~ 00.00 | OO | 00백만원 | 00백만원 |
    | 3 | OO앱 스토어 | OOO | 00년 하반기 | 00회 | - | (무료 다운로드) |
    | 4 | OO 사이트 | OOO | 00.00 ~ 00.00 | 00명 | - | (무료 회원가입) |
    | ....... |  |  |  |  |  |  |

    ▶ 표 2 — 필수:
    | 순번 | 추진 내용 | 추진 기간 | 세부 내용 |
    | --- | --- | --- | --- |
    | 1 | 기능 보완 및 개선 계획 수립 | 00.00 ~ 00.00 | 제품·서비스의 개선점 분석 |
    | 2 | SNS 고객체험단 운영 | 00.00 ~ 00.00 | 고객 피드백을 통한 개선점 도출 |
    | 3 | 제품·서비스 개선 진행 | 00.00 ~ 00.00 | 문제 기능 보완 |
    | 4 | 제품·서비스 개선 완료 | 협약기간 말 | 협약기간 내 완료 |
    | ....... |  |  |  |

    ▶ 표 3 — 필수:
    | 총사업비 (ⓐ+ⓑ+ⓒ) | 정부지원사업비(ⓐ) | 창업기업 자기부담사업비 |  |
    | --- | --- | --- | --- |
    |  |  | 현금(ⓑ) | 현물(ⓒ) |
    | 00백만원 100% | 00백만원 00.0% | 00백만원 00.0% | 00백만원 00.0% |

    ▶ 표 4 — 필수:
    | 산출 근거 | 총사업비(원) |  |
    | --- | --- | --- |
    |  | 합계(백만원) | 비율(%) |
    | •DMD소켓 구입(00개×0000원) |  |  |
    | •전원IC류 구입(00개×000원) |  |  |
    | •글로벌 시장조사 컨설팅 |  |  |
    | •국내 OO전시회 참가비 (부스 임차 등 포함) |  |  |
    | •개발자 인건비(2명) |  |  |
    | •대표자 인건비 |  |  |
    | 합 계 | 백만원 | 100% |
- id: '4'
  title: 4-1. 기업구성 및 보유 역량
  category: Team
  order: 4
  tags:
  - 팀역량
  - 대표자
  instructions: |
    대표자 보유 역량(경영 능력, 경력·학력, 기술력, 노하우, 인적 네트워크 등) 기재
    자사에서 보유하고 있는 장비·시설, 직원 역량(경력·학력, 기술력 노하우 등) 기재
    현재 고용한 전문인력 및 협약기간 내 채용 예정인 추가 인력 등에 대해서만 기재
    자사에서 보유하고 있는 장비·시설 기재

    ▶ 표 1 — 필수:
    | 현재 재직 인원 (대표자 제외, 공동대표 포함) |  |  |  | 00 명 | 추가 고용계획 (협약기간 내) | 00 명 |
    | --- | --- | --- | --- | --- | --- | --- |
    | 고용여부 | 순번 | 직위 | 담당 업무 |  | 보유역량(경력 및 학력 등) |  |
    | O | 1 | 공동대표 | S/W 개발 총괄 |  | OO학과 교수 재직(00년) |  |
    | O | 2 | 대리 | 홍보 및 마케팅 |  | OO학과 전공, 관련 경력(00년 이상) |  |
    | 예정 | ... |  |  |  |  |  |
