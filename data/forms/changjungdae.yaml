program_code: changjungdae
program_name: 2026년도 창업중심대학 지역기반 (예비)창업기업
target: 예비창업자 + 지역기반 창업기업
max_funding: 1억원
page_limit: 10
sections:
  - id: "1-1"
    title: 창업아이템 배경 및 필요성
    category: Problem
    order: 1
    tags: [개발동기, 대표자]
    instructions: |
      외부적 배경(시장 문제·기회) + 내부적 배경(대표자 경험·비전) 양면 기재.
      해결방안 필요성을 구체 데이터로.

  - id: "1-2"
    title: 창업아이템 목표시장(고객) 현황 분석
    category: Problem
    order: 2
    tags: [시장분석, 고객]
    instructions: |
      목표시장 규모·경쟁강도·성장성·고객 요구사항 조사. Bottom-up 계산식 권장.

  - id: "2-1"
    title: 창업아이템의 개발/개선 준비현황
    category: Solution
    order: 3
    tags: [개발준비]
    instructions: |
      신청 이전 준비경과, 현 시점 정량/정성 성과.

  - id: "2-2"
    title: 창업아이템 실현 및 구체화/고도화 방안
    category: Solution
    order: 4
    tags: [개발준비, 차별성]
    instructions: |
      협약기간 내/전체 단계 실현방안, 기술보호 계획.
      최종 산출물 표(형태·수량·완료일정) 필수.

  - id: "3-1"
    title: 창업아이템 비즈니스 모델
    category: Scale-up
    order: 5
    tags: [BM]
    instructions: |
      고객-가치-수익-채널-원가-파트너 요소. 다원화 BM 권장.

  - id: "3-2"
    title: 창업아이템 시장 진입 등 사업화 전략
    category: Scale-up
    order: 6
    tags: [사업화전략]
    instructions: |
      주 타깃 → 확장 타깃 순차 접근. 판매·유통·마케팅 전략.

  - id: "3-3"
    title: 사업 추진 일정 및 자금 운용 계획
    category: Scale-up
    order: 7
    tags: [일정자금, 재무]
    instructions: |
      전체 로드맵 + 협약기간 내 일정 + 자금 조달·집행 계획 (비목별).

  - id: "4-1"
    title: 조직구성원 보유역량
    category: Team
    order: 8
    tags: [팀역량, 대표자]
    instructions: |
      대표자 + 조직 현황 + 협약기간 내 추가 고용 계획.

  - id: "4-2"
    title: 외부 네트워크 현황 및 세부 활용 계획
    category: Team
    order: 9
    tags: [팀역량]
    instructions: |
      외부 파트너(생산/유통/연구/자문) 표 + 세부 활용 방안.
