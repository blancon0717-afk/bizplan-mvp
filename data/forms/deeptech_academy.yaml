program_code: deeptech_academy
program_name: 2026년 딥테크창업사관학교
target: 예비창업자 또는 창업 7년 이내 창업기업 (딥테크 분야)
max_funding: 정부지원금 총사업비의 70%
page_limit: 20
notes: |
  본문 20page 내외 작성 권장(증빙서류 등은 제한 없음).
  양식·표는 변경·삭제 불가(표 행 추가 가능, 해당 없을 시 공란 유지), 사진(이미지)·표 추가 가능.
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  개인정보(성명·성별·생년월일·출신학교·소재지 등)는 마스킹(○, * 등) 또는 삭제.
  사업비 구성: 정부지원금 70%, 입교자 부담금 30%(현금 10% + 현물 20%).
  ※ 2026년 공식 신청서 서식(붙임1) 기준 목차·표 구조를 그대로 따른다.
sections:
  - id: '0-1'
    title: 신청자 기본 정보
    category: Overview
    order: 1
    tags: []
    instructions: |
      ※ 이 섹션은 신청자 신상·행정 정보로, 초안에 없는 개인정보·행정정보는 절대 지어내지 말 것.
      ※ 출력은 아래 표 스켈레톤들을 **동일 컬럼의 markdown 표로 그대로** 출력하는 것이 전부다.
        안내문 서술·항목 설명·권장사항 작성 금지. '사업화 과제명' 셀만 초안 근거로 한 줄 제안하고
        나머지 셀은 공란 유지하여 사용자가 직접 입력하도록 한다.

      ▶ 표 1 — 신청자 기본 정보 (공란 유지, 과제명만 제안):
      | 항목 | 내용 |
      | --- | --- |
      | 권역(택1) | 수도권 / 호남권 / 영남권 |
      | 사업화 과제명 | (초안 아이템 기반으로 구체적으로 제안) |
      | 신청자 성명(생년월일) |  |
      | 성별 |  |
      | 자택주소 |  |
      | 기업명 |  |
      | 사업자등록번호 |  |
      | 법인등록번호(해당시) |  |
      | 사업장 주소 |  |
      | 사업개시일(회사성립연월일) |  |
      | 사업자 구분 | 개인/법인, 단독/공동/각자대표 |

      ▶ 표 2 — KPI 설정 (필수/각 1개 선택, 공란 유지):
      | 구분 | 선택지 |
      | --- | --- |
      | 계량(택1) | 고용 실적(3명 이상) / 기술료 수익(1억원 이상) / 투자유치(협약 내 1억원 이상) |
      | 비계량(택1) | 인증 획득 / 협력계약 체결 / 지식재산권 확보 |

      ▶ 표 3 — 사업비 구성계획 (공란 유지):
      | 합계(총사업비 100%) | 정부지원금(70%) | 현금(10%) | 현물(20%) | 소계(30%) |
      | --- | --- | --- | --- | --- |
      | 00백만원 | 00백만원 | 00백만원 | 00백만원 | 00백만원 |

  - id: '0-2'
    title: 기업 일반 현황
    category: Overview
    order: 2
    tags: []
    instructions: |
      ※ 재무·행정 실적 정보로, 초안에 근거가 없는 수치는 지어내지 말고 공란 유지.
      ※ 출력은 아래 표들을 동일 컬럼의 markdown 표로 그대로 출력하는 것이 전부다(서술 금지).
      초안에 고용·매출·투자 실적이 명시돼 있으면 그 수치만 해당 셀에 반영한다.

      ▶ 표 1 — 주요성과 (근거 없으면 공란):
      | 구분 | 2025.12.31. 실적 | 2026.11.30. 목표 |
      | --- | --- | --- |
      | 고용(명) |  |  |
      | 매출(백만원) |  |  |
      | 수출(백만원) |  |  |
      | 투자(백만원) |  |  |

      ▶ 표 2 — 산업 및 지적재산권 등록현황 (초안에 있으면 기재, 없으면 공란):
      | 재산권 종류 | 산업 및 지적재산권명 | 등록번호(년월일) | 권리권자 |
      | --- | --- | --- | --- |
      |  |  |  |  |

      ▶ 표 3 — 창업사업화 중복지원 검토 확인사항 (공란 유지):
      | 사업명 | 지원기관 | 지원기간 | 지원금액 |
      | --- | --- | --- | --- |
      |  |  |  |  |

  - id: '0-3'
    title: 사업화 과제 개요(요약)
    category: Overview
    order: 3
    tags: [시장분석, 차별성, BM]
    instructions: |
      초안 전체를 압축한 요약. **반드시 아래 표 1과 동일한 2컬럼 markdown 표로만 출력**하고,
      표 밖 서술은 금지한다. 각 '내용' 셀을 초안 내용으로 채운다(셀 안에서 여러 문장 가능).
      제품·서비스 명칭은 초안·기업 컨텍스트에 있는 명칭만 사용하고, 없으면 셀에 "(명칭 미정)"으로 표기.

      ▶ 표 1 — 사업화 과제 개요:
      | 항목 | 내용 |
      | --- | --- |
      | 명칭 | (제품·서비스명) |
      | 범주 | (예: (초격차) 반도체 등) |
      | 회사 사이트 | (없으면 공란) |
      | 소개 | (개발할 제품·서비스 개요 — 사용 용도·사양·가격, 핵심 기능·성능, 고객 제공 혜택) |
      | 진출 목표시장 | (국내 목표시장 규모·상황, 경쟁 강도, 향후 전망(성장성), 고객 특성) |
      | 경쟁사 대비 차별성 | (경쟁제품 대비 차별성, 경쟁력(보유역량)) |
      | 현황 및 구체화 방안 | (사업참여 이전 준비상황·고객 반응, 협약기간 내 진출/확장 예정 제품·서비스) |

  - id: '1-1'
    title: 제품·서비스의 개발/개선동기
    category: Problem
    order: 4
    tags: [개발동기]
    instructions: |
      ①외적 동기(사회·경제·기술 분야의 문제점·기회 등), ②내적 동기(대표자 및 자사의 보유역량,
      가치관, 비전 등)의 관점에서 제품·서비스를 개발/개선하게 된 동기를 기재.

  - id: '1-2'
    title: 제품·서비스의 개발/개선 목적
    category: Problem
    order: 5
    tags: [개발동기]
    instructions: |
      현재 시점(본 지원사업 신청 시점)의 제품·서비스 개발 상태 등 설명.
      개발 동기에서 발견한 문제점·기회에 대해 해당 제품·서비스가 제시할 수 있는 혁신적인 해결방안,
      개발/개선의 필요성, 고객들에게 제공할 혜택 등의 관점에서 개발/개선하려는 목적을 기재.

  - id: '1-3'
    title: 제품·서비스의 목표시장 분석
    category: Problem
    order: 6
    tags: [시장분석, 고객]
    instructions: |
      현재 진입한 또는 진출하려는 목표시장의 규모·상황 및 특성, 경쟁 강도, 향후 전망(성장성),
      주요 고객 특성 등 기재.

  - id: '1-4'
    title: 고객 요구사항 분석
    category: Problem
    order: 7
    tags: [고객]
    instructions: |
      현재 제품·서비스의 검증을 통해 조사·분석된 고객 요구사항에 대한 객관적 근거 기재.

  - id: '2-1'
    title: 제품·서비스의 개발/개선 방안
    category: Solution
    order: 8
    tags: [개발준비]
    instructions: |
      협약기간 내 개발/개선할 제품·서비스의 최종 산출물(형태, 수량 등), 개발 방법(대표자 직접 개발,
      인력 채용, 외주용역), 현재 시점의 개발단계 등 기재.
      제품·서비스 개발 후, 기술 유출 방지를 위한 기술 보호 계획(보안규정 및 관리체계 등) 기재.

  - id: '2-2'
    title: 고객 요구사항 대응 방안
    category: Solution
    order: 9
    tags: [고객, 개발준비]
    instructions: |
      고객 요구사항 분석을 통해 파악된 문제점에 대해 핵심 기능·성능, 디자인, 사업화 활동 등을
      개선하기 위한 방안 등 기재.

  - id: '2-3'
    title: 제품·서비스의 차별화 방안
    category: Solution
    order: 10
    tags: [차별성, 경쟁사]
    instructions: |
      경쟁제품·서비스와의 비교를 통해 파악된 문제점에 대해 자사의 보유역량을 기반으로 경쟁력을
      확보하기 위한 방안 등 기재.

  - id: '2-4'
    title: 딥테크창업사관학교 참여 핵심목표(KPI) 설정
    category: Solution
    order: 11
    tags: [사업화전략]
    instructions: |
      계량·비계량 KPI를 각 1개 선택하고 달성계획을 기재한다.
      초안 근거로 가장 현실적인 KPI를 1개씩 제안하되, 근거 없는 수치는 공란 유지.

      ▶ 표 1 — 계량 KPI 설정(1개 선택):
      | KPI 선택 | 전년도 성과 | 목표 설정 | 가이드라인 |
      | --- | --- | --- | --- |
      | 고용 실적 |  |  | 고용인원 3명 이상 |
      | 기술료 수익 |  |  | 협약 내 100백만원 이상 |
      | 투자 유치 |  |  | 협약 내 100백만원 이상 |

      ▶ 표 2 — 비계량 KPI 설정(1개 선택):
      | KPI 선택 | 목표 설정 | 가이드라인 |
      | --- | --- | --- |
      | 인증 획득 | (산업별 필수 인증 또는 규제 샌드박스 통과) | 택1, 여부 판단 |
      | 협력계약 체결 | (MOU, PoC, JDA, NDA 등 체결 기업명) | 여부 판단 |
      | 지식재산권 확보 | (1개 이상) | 여부 판단 |

      ◦ KPI 달성계획
      - 선택한 계량·비계량 KPI별로 협약기간 내 목표 달성을 위한 구체적 계획 기재.

  - id: '2-5'
    title: 딥테크창업사관학교 피어러닝 계획서
    category: Team
    order: 12
    tags: [팀역량]
    instructions: |
      시장진출, 투자유치 경험, 링크드인 활용 방법 등 입교기업의 노하우 공유 계획.
      초안의 팀 역량·추진성과를 근거로 제안한다. 아래 4개 항목을 각각 ◦ 헤드라인으로 다룬다:
      기업 강점(보유 전문 역량, 공유 가능 자산 등) / 피어러닝 제안 주제명 /
      피어러닝 진행 방식 / 기대 효과 및 커뮤니티 기여도.

  - id: '3-1'
    title: 제품·서비스의 사업화 방안
    category: Scale-up
    order: 13
    tags: [BM, 사업화전략]
    instructions: |
      [3-1-1. 비즈니스 모델(BM)] 수익화를 위한 수익 모델 기재.
      [3-1-2. 목표시장 진입 현황] 생산·출시, 홍보·마케팅, 유통·판매 현황과 매출 실적. 서비스는 회원·다운로드 수.
      [3-1-3. 목표시장 진출 방안] 구체적 진출 방안 및 예상 매출금액.
      [3-1-4. 진출 희망 세그먼트 진출 방안 및 성과] 시장진출 방식, 단계별 실행 계획, 수치화된 목표.

      ▶ 표 1 — 매출 실적 (실적 없으면 공란):
      | 순번 | 목표시장(고객) | 제품(서비스) | 진입 시기(기간) | 판매(이용)량 | 가격 | 판매 금액 |
      | --- | --- | --- | --- | --- | --- | --- |
      |  |  |  |  |  |  |  |

      ▶ 표 2 — 추정 매출:
      | 순번 | 목표시장(고객) | 제품(서비스) | 진출 시기(기간) | 판매(이용)량 | 가격 | 판매 금액 |
      | --- | --- | --- | --- | --- | --- | --- |
      |  |  |  |  |  |  |  |

  - id: '3-2'
    title: 사업 추진 일정
    category: Scale-up
    order: 14
    tags: [일정자금]
    instructions: |
      [3-2-1. 사업 전체 로드맵] 전체 사업 단계의 목표 및 종합 추진 일정.
      [3-2-2. 협약기간 내 목표 및 달성 방안] 협약기간 내 달성 가능한 목표 및 상세 추진 일정.

      ▶ 표 1 — 사업 추진 일정(전체 사업단계):
      | 순번 | 추진 내용 | 추진 기간 | 세부 내용 |
      | --- | --- | --- | --- |
      |  |  |  |  |

      ▶ 표 2 — 사업 추진 일정(협약기간 내):
      | 순번 | 추진 내용 | 추진 기간 | 세부 내용 |
      | --- | --- | --- | --- |
      |  |  |  |  |

  - id: '3-3'
    title: 자금 소요 및 조달계획
    category: Scale-up
    order: 15
    tags: [일정자금, 재무]
    instructions: |
      [3-3-1. 사업 추진을 위한 자금 소요계획] 사업비(정부지원금) 집행계획.
        정부지원금은 총사업비의 70% 이하, 대응자금 현금 10% 이상·현물 20% 이하로 작성.
      [3-3-2. 기타 자금 조달계획] 정부지원금 외 대응자금 등 구체적인 조달 방안.
      ※ 초안에 근거 없는 금액은 지어내지 말고 공란 또는 산출근거만 제시.

      ▶ 표 1 — 사업비 집행계획(정부지원금+대응자금):
      | 비목 | 산출근거 | 정부지원금(ⓐ) | 대응자금 현금 | 대응자금 현물 | 합계(ⓐ+ⓑ) |
      | --- | --- | --- | --- | --- | --- |
      | 재료비 |  |  |  |  |  |
      | 외주용역비 |  |  |  |  |  |
      | 인건비 |  |  |  |  |  |
      | 합 계 |  |  |  |  |  |

  - id: '3-4'
    title: 투자유치 실적 및 계획
    category: Scale-up
    order: 16
    tags: [투자]
    instructions: |
      [3-4-1. 투자유치 실적] 관련 실적이 없는 경우 '해당사항 없음'으로 기재.
        ▶ 표 1은 반드시 출력한다 — 실적이 초안에 있으면 행을 채우고, 없으면 행에 '해당사항 없음' 기재.
      [3-4-2. 투자유치 계획] 필요한 자금 규모와 사용 목적, 목표 투자 단계(시드·프리A 등),
      주요 투자자 유형, 투자유치를 통한 성장목표를 현실성 있게 작성.

      ▶ 표 1 — 투자유치 실적:
      | 유치시기 | 투자자명 | 투자금액 | 비고(투자 단계 등) |
      | --- | --- | --- | --- |
      |  |  |  |  |

  - id: '4-1'
    title: 대표자 현황 및 보유역량
    category: Team
    order: 17
    tags: [대표자, 팀역량]
    instructions: |
      대표자가 보유하고 있는 역량(경영 능력, 경력·학력, 기술력, 노하우, 인적 네트워크 등) 기재.
      유사 사업화 경험, 사업화 지원사업 수행 이력, 관련 교육 이수 현황, 관련 수상 실적 등 포함.
      ※ 성명·생년월일·출신학교 등 개인정보는 마스킹 또는 공란.

      ▶ 표 1 — 대표자 경력 (개인정보 셀은 공란 유지):
      | 구분 | 내용 |
      | --- | --- |
      | 학력(졸업연월/최종학력/학과·전공) |  |
      | 주요경력(기간/근무처/최종직위) |  |
      | 동업종 종사기간 |  |
      | 자격사항(취득연월일/종류/발행기관) |  |

  - id: '4-2'
    title: 기업 현황 및 보유역량
    category: Team
    order: 18
    tags: [팀역량]
    instructions: |
      자사에서 보유하고 있는 장비·시설, 직원 역량(경력·학력, 기술력 노하우 등) 기재.
      재직 인력 고용현황(정규직만), 관련 분야 인력 현황, 추가 인력 고용계획(협약기간 내),
      업무파트너(협력기업 등) 현황 및 역량, 기술보호 노력 순으로 작성.
      1인 기업은 대표자 역량·보유 장비 중심으로 기재.

      ▶ 표 1 — 재직 인력 고용현황:
      | 순번 | 직위 | 담당 업무 | 보유역량(경력 및 학력 등) |
      | --- | --- | --- | --- |
      |  |  |  |  |

      ▶ 표 2 — 추가 인력 고용계획(협약기간 내):
      | 순번 | 주요 담당업무 | 요구역량(경력 및 학력 등) | 채용 시기 |
      | --- | --- | --- | --- |
      |  |  |  |  |

      ▶ 표 3 — 업무파트너(협력기업 등) 현황 및 역량:
      | 순번 | 파트너명 | 주요역량 | 주요 협력사항 | 비고 |
      | --- | --- | --- | --- | --- |
      |  |  |  |  |  |

      ◦ 기술보호 노력
      - 개발하는 제품·서비스의 보호방안 및 자체 기술보호(보안) 관리 체계 기재.

# ── 갭 보완 인터뷰 (양식 변환 전 고정 5문항 — 초안에 없는 딥테크 필수 정보) ──
