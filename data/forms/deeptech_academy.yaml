program_code: deeptech_academy
program_name: 2026년도 창업중심대학(대학발) 창업기업
target: 예비창업자 또는 창업 3년 이내 대학발 창업기업
max_funding: 1.5억원
page_limit: 10
notes: |
  개인정보(성명·성별·생년월일·출신학교·소재지 등)는 마스킹(○, * 등) 또는 삭제.
  파란색 안내 문구 삭제 후 검정 글씨로 작성.
  표 안의 행은 추가 가능; 해당 없을 시 공란 유지.
  정부지원사업비는 총사업비의 70% 이하, 현금 10% 이상, 현물 20% 이하.
  예비창업자는 정부지원사업비 100%로 구성 가능(자기부담사업비 불필요).
sections:
  - id: '1-1'
    title: 창업아이템 배경 및 필요성
    category: Problem
    order: 1
    tags: [개발동기, 대표자]
    instructions: |
      ①외부적 배경 및 동기(사회·경제·기술적 관점, 국내·외 시장의 문제점·기회 등).
      ②내부적 배경 및 동기(대표자 경험, 가치관, 비전 등의 관점).
      배경 및 필요성에서 발견한 문제점과 해결방안, 필요성 기재.
      본 사업 신청 전 기획·추진한 경과(이력) 및 추진 목적(해결방안) 기재.

  - id: '1-2'
    title: 창업아이템 목표시장(고객) 현황 분석
    category: Problem
    order: 2
    tags: [시장분석, 고객]
    instructions: |
      창업아이템 개발 배경 및 필요성에 따라 목표시장(고객) 설정.
      목표시장 규모·경쟁강도·성장성·고객 요구사항 분석. Bottom-up 계산식 권장.
      경쟁사 및 대체 제품·서비스 분석.

  - id: '2-1'
    title: 창업아이템의 개발/개선 준비현황
    category: Solution
    order: 3
    tags: [개발준비]
    instructions: |
      본 사업 신청 이전 기획·추진한 경과(이력) 기재.
      신청 시점의 아이템 개발·개선·구체화 현황, 목표 시장(고객) 반응, 주요 정량·정성 성과 기재.

  - id: '2-2'
    title: 창업아이템 실현 및 구체화/고도화 방안
    category: Solution
    order: 4
    tags: [개발준비, 차별성]
    instructions: |
      ①협약 기간 내 및 ②전체 사업단계 실현·구체화하고자 하는 개발/개선 방안.
      목표시장(고객) 요구사항 분석을 통한 핵심 기능·성능, 디자인, 사업화 활동 등 대응 방안.
      경쟁사 제품·서비스와의 차별성 및 경쟁력 확보 전략.

      ▶ 표 1 — 필수:
      | 구분 | 최종 산출물 | 수량 | 완료 일정 |
      | --- | --- | --- | --- |
      | 협약기간 내 | OO 제품/서비스 | 1 | ~'26.12.31. |
      | 중·장기 | OO 제품/서비스 | 1 | ~'28.12.31. |

  - id: '3-1'
    title: 창업아이템 비즈니스 모델
    category: Scale-up
    order: 5
    tags: [BM]
    instructions: |
      개발/개선/구체화하고자 하는 제품·서비스의 수익 창출을 위한 BM 기재.
      정의된 목표시장(고객)에 대한 진입 현황과 그간 추진성과 및 전략 기재.

  - id: '3-2'
    title: 창업아이템 시장 진입 등 사업화 전략
    category: Scale-up
    order: 6
    tags: [사업화전략]
    instructions: |
      목표시장(고객) 내 세부 고객·경쟁사·대체 제품 분석을 통해 사업 진입·확장 전략 수립.
      생산·출시, 홍보·마케팅, 유통·판매, 인력·네트워크 확보 등 구체적 방안.
      협약기간 내 달성 사업화 성과(매출, 투자, 고용 등) 기재.

  - id: '3-3'
    title: 사업 추진 일정 및 자금 운용 계획
    category: Scale-up
    order: 7
    tags: [일정자금, 재무]
    instructions: |
      [3-3-1. 사업 전체 로드맵] 전체 사업단계 종합 목표 및 추진 일정.
      [3-3-2. 협약기간 내 목표 및 달성 방안] 협약기간('26.5~12월) 내 달성 가능한 목표 및 상세 추진 일정.
      [3-3-3. 자금 필요성 및 조달계획] 사업비 외 추가 자본금(Seed·시리즈A·B 등 투자유치) 조달계획.
      [3-3-4. 사업비 집행계획] 비목별 금액 적정성 및 집행계획. 정부지원사업비 최대 1.5억원 한도.

      ▶ 표 1 — 사업 전체 로드맵:
      | 순번 | 추진 내용 | 추진 기간 | 세부 내용 |
      | --- | --- | --- | --- |
      | 1 | 시제품 설계 | 00년 상반기 | 시제품 설계 및 프로토타입 제작 |
      | 2 | 시제품 제작 | 00.00 ~ 00.00 | 외주 용역을 통한 시제품 제작 |
      | 3 | 정식 출시 | 00년 하반기 | 신제품 출시 |
      | … |  |  |  |

      ▶ 표 2 — 협약기간 내 추진 일정:
      | 순번 | 추진 내용 | 추진 기간 | 세부 내용 |
      | --- | --- | --- | --- |
      | 1 | 기능 보완 및 개선 계획 수립 | 00.00 ~ 00.00 | 제품·서비스의 개선점 분석 |
      | 2 | SNS 고객체험단 운영 | 00.00 ~ 00.00 | 고객 피드백을 통한 개선점 도출 |
      | 3 | 제품·서비스 개선 진행 | 00.00 ~ 00.00 | 문제 기능 보완 |
      | 4 | 제품·서비스 개선 완료 | 협약기간 말 | 협약기간 내 완료 |
      | … |  |  |  |

      ▶ 표 3 — 사업비 집행계획:
      | 비 목 | 집행 계획 | 총사업비(원) (ⓐ+ⓑ) |  |  |  |
      | --- | --- | --- | --- | --- | --- |
      |  |  | 정부지원사업비(ⓐ) | 자기부담사업비(ⓑ) |  | 합계(ⓐ+ⓑ) |
      |  |  |  | 현금 | 현물 |  |
      | 재료비 | •DMD소켓 구입(00개×0000원) | 3,448,000 |  |  | 3,448,000 |
      | 외주용역비 | •시금형제작 외주용역 | 3,000,000 | 7,000,000 |  | 10,000,000 |
      | … |  |  |  |  |  |
      | 합 계 |  | ... | ... | ... | ... |

  - id: '4-1'
    title: 조직구성원 보유역량
    category: Team
    order: 8
    tags: [팀역량, 대표자]
    instructions: |
      대표자 보유 역량(경영 능력, 경력·학력, 기술력, 노하우, 인적 네트워크 등) 기재.
      보유 장비·시설, 직원 역량(경력·학력, 기술력, 노하우 등) 기재.
      현재 채용 완료·팀원 참여 인력만 기재. 1인 창업기업은 대표자 역량만 작성 가능.

      ▶ 표 1 — 팀 현황:
      | 현원(대표자 제외) | 00 명 | 추가 고용계획(협약기간 내) | 00 명 |
      | --- | --- | --- | --- |
      | 고용여부 | 직위 | 담당 업무 | 보유역량(경력 및 학력 등) |
      | O | 공동대표 | S/W 개발 총괄 | OO학과 교수 재직(00년) |
      | O | 대리 | 홍보 및 마케팅 | OO학과 전공, 관련 경력(00년 이상) |
      | 예정 | … |  |  |

      ▶ 표 2 — 추가 고용 및 활용 계획:
      | 순번 | 주요 담당업무 | 요구역량(경력 및 학력 등) | 채용 시기 |
      | --- | --- | --- | --- |
      | 1 | 해외 영업 | OO학과 전공, 관련 경력(00년 이상) | 00.00 |
      | … |  |  |  |

  - id: '4-2'
    title: 외부 네트워크 현황 및 세부 활용 계획
    category: Team
    order: 9
    tags: [팀역량]
    instructions: |
      협력(또는 예정)인 대학, 지자체, 민간기업, 창업 유관기관 등 파트너 네트워크 및 세부 협업 내용 기재.

      ▶ 표 1 — 네트워크 구축 및 활용 계획:
      | 순번 | 파트너명 | 보유역량 | 협업방안 | 협력 시기 |
      | --- | --- | --- | --- | --- |
      | 1 | ○○전자 | 시제품 관련 H/W 제작·개발 | 테스트 장비 지원 | 00.00 |
      | 2 | ○○기업 | S/W 제작·개발 | 웹사이트 제작 용역 | 00.00 |
      | ... |  |  |  |  |
